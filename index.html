<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>샛별교사 업무포털 활용 안내</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PC3SLD3F4X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-PC3SLD3F4X');
    </script>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #333;
            line-height: 1.6;
        }

        /* [Header] */
        header {
            background-color: #1a365d; 
            padding: 35px 25px 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-inner {
            max-width: 1060px; 
            margin: 0 auto;
        }

        /* 1. 최상단 기관명 영역 */
        .agency-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .emblem {
            height: 28px; 
            width: auto;
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.9));
        }

        .agency-text {
            color: #90cdf4; 
            font-size: 17px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }

        /* [Header Title] */
        .title-area {
            display: flex;
            align-items: center; 
            justify-content: center;
            gap: 15px; 
            margin-bottom: 20px; 
        }

        .title-area img {
            height: 52px; 
            width: auto;
            display: block;
        }

        .main-title {
            color: #ffffff;
            font-size: 40px; 
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1; 
        }

        /* [Header Description] */
        .header-desc {
            text-align: center;
            color: #edf2f7;
            font-size: 15.5px;
            font-weight: 500;
            margin-bottom: 12px; 
            word-break: keep-all;
        }

        /* 2. 제작자 영역 */
        .author-box {
            border-top: 1px solid rgba(255, 255, 255, 0.15); 
            padding-top: 10px;
            text-align: right; 
        }

        .author-text {
            color: #90cdf4;
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 3. 정의 영역: 얇은 가로 띠 */
        .definition-wrapper {
            background-color: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .definition-box {
            max-width: 1050px; 
            margin: 0 auto;
            background-color: #f8fafc; 
            border-radius: 8px;
            padding: 12px 25px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 40px; 
            border: 1px solid #e2e880;
        }

        .def-row {
            display: flex;
            align-items: center;
        }

        .def-logo img {
            height: 20px; 
            width: auto;
            margin-right: -2px; 
        }

        .def-divider {
            color: #cbd5e1; 
            margin: 0 12px; 
            font-weight: 300;
            font-size: 16px;
        }

        .def-text {
            font-size: 14px;
            color: #334155; 
            font-weight: 500;
            word-break: keep-all;
        }

        /* [Container] */
        .container {
            max-width: 1240px;
            margin: 40px auto 60px; 
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 24px;
        }

        .manual-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid #ffffff;
        }

        .manual-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #3b82f6; 
        }

        .card-image-wrap {
            width: 100%;
            height: 180px;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card-content {
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 19px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            word-break: keep-all;
        }

        .card-desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 44.8px;
        }

        .card-action {
            margin-top: auto;
            font-size: 14px;
            font-weight: 600;
            color: #3b82f6;
            display: flex;
            align-items: center;
        }

        .card-action::after {
            content: '→';
            margin-left: 6px;
        }

        /* [Footer] */
        footer {
            background-color: #ffffff;
            text-align: center;
            padding: 25px 20px; 
            border-top: 1px solid #e2e8f0;
        }

        footer img {
            max-width: 100%;
            height: 65px; 
            width: auto;
        }

        @media (max-width: 950px) {
            .definition-box {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }

        @media (max-width: 768px) {
            .title-area {
                flex-direction: column;
                gap: 5px;
            }
            .main-title {
                font-size: 30px;
            }
            .author-box {
                text-align: center; 
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="agency-area">
                <img src="emblem.png" alt="엠블럼" class="emblem">
                <span class="agency-text">서울특별시남부교육지원청 초등교육지원과</span>
            </div>
            
            <div class="title-area">
                <img src="logo_sb_text.png" alt="샛별교사 로고">
                <h1 class="main-title">업무포털 활용 안내</h1>
            </div>
            
            <p class="header-desc">샛별교사에게 가장 필요한 내용을 선별하여, 샛별교사가 직접 만든 업무포털 활용법</p>
            
            <div class="author-box">
                <span class="author-text">제작: 서울개봉초등학교 샛별교사 김태완</span>
            </div>
        </div>
    </header>

    <section class="definition-wrapper">
        <div class="definition-box">
            <div class="def-row">
                <div class="def-logo">
                    <img src="logo_star.png" alt="★">
                </div>
                <div class="def-divider">|</div>
                <div class="def-text">새로운 시작을 알리는 별, 새롭게 나타나 장래에 큰 발전을 이룩할만한 사람을 비유적으로 이르는 말</div>
            </div>
            <div class="def-row">
                <div class="def-logo">
                    <img src="logo_sb_text.png" alt="샛별교사">
                </div>
                <div class="def-divider">|</div>
                <div class="def-text">남부 초등 신규 및 저경력교사를 의미함</div>
            </div>
        </div>
    </section>

    <div class="container" id="manual-container"></div>

    <footer>
        <img src="logo_office.png" alt="서울특별시남부교육지원청 로고">
    </footer>

    <script src="data.js"></script>
    <script>
        const container = document.getElementById('manual-container');
        manualData.forEach(item => {
            const imageHtml = item.thumbnail 
                ? `<img src="${item.thumbnail}" alt="${item.title}" onerror="this.outerHTML='<div class=\\'no-image\\'>이미지 준비중</div>'">`
                : `<div class="no-image">이미지 없음</div>`;

            // GA4 클릭 추적 센서
            const cardHtml = `
                <a href="${item.link}" class="manual-card" target="_blank" rel="noopener noreferrer" onclick="gtag('event', 'manual_click', { 'manual_title': '${item.title}' });">
                    <div class="card-image-wrap">${imageHtml}</div>
                    <div class="card-content">
                        <h2 class="card-title">${item.title}</h2>
                        <p class="card-desc">${item.description}</p>
                        <div class="card-action">상세 내용 보기</div>
                    </div>
                </a>
            `;
            container.innerHTML += cardHtml;
        });
    </script>
</body>
</html>
